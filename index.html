<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#271b14">
  <title>دعوة زفاف عائلة الفقي</title>
  <meta name="description" content="يسر عائلة الفقي دعوتكم لحضور حفل الزفاف">
  <meta property="og:type" content="website">
  <meta property="og:title" content="دعوة زفاف عائلة الفقي">
  <meta property="og:description" content="يسر عائلة الفقي دعوتكم لحضور حفل الزفاف">
  <meta property="og:image" content="https://khalid-rashida.github.io/groom-wedding/preview.jpg">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:locale" content="ar_SA">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="دعوة زفاف عائلة الفقي">
  <meta name="twitter:image" content="https://khalid-rashida.github.io/groom-wedding/preview.jpg">
  <link rel="icon" href="favicon.png">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <style>
    *{box-sizing:border-box}
    html{scroll-behavior:smooth;background:#271b14}
    body{margin:0;min-height:100%;background:radial-gradient(circle at 50% 15%,#4b3527 0,#2d2018 42%,#17100c 100%);font-family:Tahoma,Arial,sans-serif;color:#fff;overflow-x:hidden}
    button,a{-webkit-tap-highlight-color:transparent}
    .cover{min-height:100svh;display:grid;place-items:center;padding:max(20px,env(safe-area-inset-top)) 16px max(24px,env(safe-area-inset-bottom));transition:opacity .7s ease,transform .7s ease;position:relative;z-index:5}
    .cover.opening{opacity:0;transform:translateY(-4vh) scale(.97);pointer-events:none}
    .cover-card{width:min(1120px,96vw);display:flex;flex-direction:column;align-items:center;gap:14px}
    .envelope-frame{position:relative;width:100%;aspect-ratio:1262/630;filter:drop-shadow(0 22px 25px rgba(0,0,0,.48));overflow:visible}
    .envelope{width:100%;height:100%;display:block;object-fit:contain;user-select:none;-webkit-user-drag:none}
    .seal-glow{position:absolute;left:50.55%;top:76.4%;width:16.8%;aspect-ratio:1;border-radius:50%;transform:translate(-50%,-50%);border:2px solid rgba(255,213,93,.9);box-shadow:0 0 10px #ffd65c,0 0 22px rgba(255,199,62,.72),inset 0 0 12px rgba(255,222,124,.4);animation:pulse 1.8s ease-in-out infinite;pointer-events:none}
    @keyframes pulse{0%,100%{transform:translate(-50%,-50%) scale(.91);opacity:.52}50%{transform:translate(-50%,-50%) scale(1.05);opacity:1}}
    .open-btn{border:1px solid #d7a94c;color:#fff7df;background:linear-gradient(#ad731c,#6f420d);box-shadow:0 8px 22px rgba(0,0,0,.35),inset 0 1px rgba(255,255,255,.35);border-radius:999px;padding:14px 34px;font-size:clamp(16px,2vw,22px);font-weight:700;cursor:pointer;min-width:min(330px,80vw);transition:transform .2s,filter .2s}
    .open-btn:active{transform:scale(.97)}
    .hint{font-size:13px;color:#d7c6ad;opacity:.85}
    .invite-section{display:none;opacity:0;transform:translateY(30px);transition:opacity .8s ease,transform .8s ease;padding:18px 0 56px;min-height:100vh}
    .invite-section.visible{display:block}
    .invite-section.reveal{opacity:1;transform:none}
    .invite-wrap{position:relative;width:min(1024px,100vw);margin:auto;filter:drop-shadow(0 25px 34px rgba(0,0,0,.55))}
    .invite-img{display:block;width:100%;height:auto;user-select:none;-webkit-user-drag:none}
    .timer-value{position:absolute;top:64.15%;transform:translate(-50%,-50%);width:15.2%;text-align:center;font-family:Georgia,'Times New Roman',serif;font-size:clamp(26px,7vw,72px);line-height:1;font-weight:700;color:#59330c;text-shadow:0 1px 0 rgba(255,255,255,.7);font-variant-numeric:tabular-nums;direction:ltr}
    .seconds{left:81.65%}.minutes{left:59.75%}.hours{left:37.85%}.days{left:16.35%}
    .map-hit{position:absolute;left:24.5%;top:85.35%;width:51%;height:6.2%;border-radius:14px;cursor:pointer}
    .audio-btn{position:fixed;z-index:20;left:16px;bottom:calc(16px + env(safe-area-inset-bottom));width:48px;height:48px;border-radius:50%;border:1px solid #d6a64c;background:rgba(51,31,16,.9);color:#f8ddb0;font-size:21px;box-shadow:0 6px 18px rgba(0,0,0,.35);display:none;place-items:center;cursor:pointer;backdrop-filter:blur(6px)}
    .audio-btn.show{display:grid}
    @media(max-width:600px){
      .cover{padding-left:0;padding-right:0}
      .cover-card{width:100%}
      .envelope-frame{width:100%;aspect-ratio:1262/630}
      .seal-glow{width:17.5%;left:50.55%;top:76.4%}
      .open-btn{padding:12px 24px;margin-top:2px}
      .invite-section{padding-top:0}
      .timer-value{font-size:clamp(24px,9vw,54px);top:64.15%}
      .map-hit{top:85.25%;height:6.4%}
    }
    @media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
  </style>
</head>
<body>
  <main>
    <section class="cover" id="cover" aria-label="واجهة دعوة الزفاف">
      <div class="cover-card">
        <div class="envelope-frame" id="envelopeFrame">
          <img class="envelope" src="envelope.webp" alt="دعوة زفاف خالد منير الفقي">
          <span class="seal-glow" aria-hidden="true"></span>
        </div>
        <button class="open-btn" id="openBtn" type="button">اضغط هنا لفتح الدعوة</button>
        <div class="hint">تبدأ الموسيقى بعد الضغط</div>
      </div>
    </section>

    <section class="invite-section" id="inviteSection" aria-label="تفاصيل دعوة الزفاف">
      <div class="invite-wrap">
        <img class="invite-img" src="invitation.webp?v=2" alt="دعوة زفاف خالد منير الفقي، يوم الثلاثاء 11 أغسطس 2026 في قاعة التهاني">
        <span class="timer-value seconds" id="seconds">00</span>
        <span class="timer-value minutes" id="minutes">00</span>
        <span class="timer-value hours" id="hours">00</span>
        <span class="timer-value days" id="days">00</span>
        <a class="map-hit" href="https://www.google.com/maps/search/?api=1&query=%D9%82%D8%A7%D8%B9%D8%A9+%D8%A7%D9%84%D8%AA%D9%87%D8%A7%D9%86%D9%8A+%D8%AC%D8%AF%D8%A9+%D8%AD%D9%8A+%D8%A7%D9%84%D8%A3%D8%AC%D8%A7%D9%88%D9%8A%D8%AF" target="_blank" rel="noopener" aria-label="فتح موقع قاعة التهاني في خرائط Google"></a>
      </div>
    </section>
  </main>

  <audio id="music" src="music.mp3" preload="auto" loop></audio>
  <button class="audio-btn" id="audioBtn" type="button" aria-label="إيقاف أو تشغيل الموسيقى">🔊</button>

  <script>
    const cover=document.getElementById('cover');
    const invite=document.getElementById('inviteSection');
    const openBtn=document.getElementById('openBtn');
    const frame=document.getElementById('envelopeFrame');
    const music=document.getElementById('music');
    const audioBtn=document.getElementById('audioBtn');
    let opened=false;

    async function openInvitation(){
      if(opened)return; opened=true;
      frame.animate([
        {transform:'scale(1) rotate(0deg)'},
        {transform:'scale(1.015) rotate(-.25deg)',offset:.45},
        {transform:'scale(.98) translateY(-10px) rotate(.2deg)'}
      ],{duration:700,easing:'cubic-bezier(.2,.7,.2,1)',fill:'forwards'});
      try{await music.play();audioBtn.textContent='🔊'}catch(e){audioBtn.textContent='▶'}
      audioBtn.classList.add('show');
      cover.classList.add('opening');
      invite.classList.add('visible');
      setTimeout(()=>{
        cover.style.display='none';
        requestAnimationFrame(()=>invite.classList.add('reveal'));
        window.scrollTo({top:0,behavior:'smooth'});
      },720);
    }
    openBtn.addEventListener('click',openInvitation);
    frame.addEventListener('click',openInvitation);
    audioBtn.addEventListener('click',async()=>{
      if(music.paused){try{await music.play();audioBtn.textContent='🔊'}catch(e){}}else{music.pause();audioBtn.textContent='🔇'}
    });

    // العد التنازلي إلى بداية يوم 11 أغسطس 2026 بتوقيت السعودية، دون إدخال ساعة الحفل 11 مساءً.
    const target=new Date('2026-08-11T00:00:00+03:00').getTime();
    const el={d:document.getElementById('days'),h:document.getElementById('hours'),m:document.getElementById('minutes'),s:document.getElementById('seconds')};
    function updateCountdown(){
      let diff=Math.max(0,target-Date.now());
      const days=Math.floor(diff/86400000); diff%=86400000;
      const hours=Math.floor(diff/3600000); diff%=3600000;
      const minutes=Math.floor(diff/60000); diff%=60000;
      const seconds=Math.floor(diff/1000);
      el.d.textContent=String(days).padStart(2,'0');
      el.h.textContent=String(hours).padStart(2,'0');
      el.m.textContent=String(minutes).padStart(2,'0');
      el.s.textContent=String(seconds).padStart(2,'0');
    }
    updateCountdown(); setInterval(updateCountdown,1000);
  </script>
</body>
</html>
