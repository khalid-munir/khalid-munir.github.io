  <style>
    :root{--paper:#ead7b9;--brown:#4c2c12}
    *{box-sizing:border-box}
    html{scroll-behavior:smooth;background:var(--paper)}
    body{margin:0;background:var(--paper);font-family:Tahoma,Arial,sans-serif;color:var(--brown);overflow-x:hidden}
    .cover{min-height:100svh;display:grid;place-items:center;position:relative;overflow:hidden;background:#ead7b9}
    .cover-wrap{position:relative;width:min(100vw,768px);line-height:0;transform-origin:center;transition:opacity .7s ease,transform .9s cubic-bezier(.2,.8,.2,1),filter .7s ease}
    .cover-wrap img,.card img{display:block;width:100%;height:auto;user-select:none;-webkit-user-drag:none}
    .seal-hit{position:absolute;left:42.8%;top:53%;width:14.4%;aspect-ratio:1;border:0;background:transparent;cursor:pointer;border-radius:50%;-webkit-tap-highlight-color:transparent;z-index:3}
    .seal-ring{position:absolute;left:43.3%;top:53.68%;width:13.4%;aspect-ratio:1;border:2px solid rgba(255,219,116,.82);border-radius:50%;pointer-events:none;animation:pulse 1.9s ease-in-out infinite;box-shadow:0 0 18px rgba(255,211,91,.72),inset 0 0 12px rgba(255,219,116,.4);transform-origin:50% 50%;z-index:2}
    .open-label{position:absolute;left:50%;top:73.2%;transform:translateX(-50%);white-space:nowrap;color:#6b451d;background:rgba(246,229,202,.91);border:1px solid rgba(171,116,33,.65);border-radius:999px;padding:.68rem 1.55rem;font:inherit;font-size:clamp(16px,3.2vw,22px);line-height:1.25;box-shadow:0 8px 24px rgba(71,42,16,.16);cursor:pointer;z-index:4;-webkit-tap-highlight-color:transparent}
    @keyframes pulse{0%,100%{transform:scale(.88);opacity:.42}50%{transform:scale(1.22);opacity:1}}
    .cover.opening .cover-wrap{transform:scale(1.055) translateY(-2%);opacity:0;filter:blur(4px)}
    .invitation{display:none;min-height:100svh;position:relative;isolation:isolate;overflow:hidden;padding:clamp(24px,6vh,72px) 0;justify-content:center;align-items:flex-start;background:#ead7b9}
    .invitation::before{content:'';position:fixed;inset:-32px;z-index:-2;background-position:center;background-size:cover;background-repeat:no-repeat;filter:blur(28px) saturate(.78) brightness(1.04);transform:scale(1.08);opacity:0;transition:opacity .45s ease}
    .invitation.bg-ready::before{background-image:var(--invitation-bg);opacity:.62}
    .invitation::after{content:'';position:fixed;inset:0;z-index:-1;background:linear-gradient(180deg,rgba(238,217,185,.78),rgba(234,215,185,.56) 22%,rgba(234,215,185,.42) 78%,rgba(238,217,185,.82));pointer-events:none}
    .invitation.show{display:flex;animation:reveal .9s ease both}
    @keyframes reveal{from{opacity:0;transform:translateY(30px)}to{opacity:1;transform:none}}
    .card{position:relative;width:min(100vw,768px);aspect-ratio:1023/1537;line-height:0;box-shadow:0 18px 55px rgba(73,40,10,.22);overflow:hidden;background:#ead7b9}
    .card>img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain}
    .counter{position:absolute;inset:0;pointer-events:none}
    .num{position:absolute;transform:translate(-50%,-50%);display:flex;align-items:center;justify-content:center;text-align:center;font-family:Georgia,'Times New Roman',serif;font-weight:700;color:#5a350d;font-size:clamp(30px,7.1vw,58px);line-height:1;font-variant-numeric:tabular-nums;text-shadow:0 1px 0 rgba(255,255,255,.35)}
    #days{left:20%;top:65.2%}#hours{left:39.1%;top:65.2%}#minutes{left:58.1%;top:65.2%}#seconds{left:77.2%;top:65.2%}
    .location-link{position:absolute;left:27.8%;top:85%;width:44.4%;height:5.9%;border-radius:12px;display:block;-webkit-tap-highlight-color:transparent}
    .music-toggle{position:fixed;z-index:20;bottom:max(15px,env(safe-area-inset-bottom));left:15px;width:46px;height:46px;border-radius:50%;border:1px solid rgba(255,230,160,.65);background:rgba(79,45,13,.86);color:#fff3d1;font-size:20px;display:none;place-items:center;box-shadow:0 8px 24px rgba(0,0,0,.25);cursor:pointer}.music-toggle.show{display:grid}
    .loading{position:absolute;inset:0;display:none;place-items:center;background:rgba(234,215,185,.55);z-index:6;color:#6b451d;font-size:16px}.loading.show{display:grid}
    @media(min-width:769px){body{background:#d8c09c}.cover{background:radial-gradient(circle at 50% 35%,#f1dfc1 0,#dcc39d 75%)}.cover-wrap{box-shadow:0 16px 55px rgba(72,39,12,.22)}.invitation{padding:clamp(48px,7vh,96px) 28px}.card{width:min(76vw,768px);border-radius:4px}}
    @media(max-width:480px){.open-label{top:73.5%;padding:.58rem 1.35rem}.invitation{padding:24px 0 72px}.card{width:100vw}.num{font-size:clamp(28px,8.2vw,42px)}}
    @media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
  </style>
</head>
<body>
  <section class="cover" id="cover" aria-label="غلاف دعوة زفاف عائلة الفقي">
    <div class="cover-wrap">
      <img src="envelope.webp?v=7" alt="دعوة زفاف عائلة الفقي" fetchpriority="high" decoding="async">
      <button class="seal-hit" id="openInvite" aria-label="فتح الدعوة"></button>
      <span class="seal-ring" aria-hidden="true"></span>
      <button class="open-label" id="openLabel" type="button">اضغط هنا</button>
    </div>
  </section>

  <main class="invitation" id="invitation">
    <div class="card">
      <div class="loading" id="loading">جاري فتح الدعوة…</div>
      <img id="invitationImage" data-src="invitation.webp?v=7" alt="دعوة زفاف خالد منير الفقي" decoding="async">
      <div class="counter" aria-label="العد التنازلي للزفاف">
        <span class="num" id="seconds">00</span><span class="num" id="minutes">00</span><span class="num" id="hours">00</span><span class="num" id="days">00</span>
      </div>
      <a class="location-link" href="https://www.google.com/maps/search/?api=1&query=%D9%82%D8%A7%D8%B9%D8%A9+%D8%A7%D9%84%D8%AA%D9%87%D8%A7%D9%86%D9%8A+%D8%AC%D8%AF%D8%A9" target="_blank" rel="noopener" aria-label="فتح موقع قاعة التهاني"></a>
    </div>
  </main>

  <button class="music-toggle" id="musicToggle" aria-label="تشغيل أو إيقاف الموسيقى">♪</button>
  <audio id="music" data-src="music.mp3" preload="none" loop></audio>

  <script>
    const cover=document.getElementById('cover'),invite=document.getElementById('invitation'),openBtn=document.getElementById('openInvite'),openLabel=document.getElementById('openLabel'),music=document.getElementById('music'),musicToggle=document.getElementById('musicToggle'),invitationImage=document.getElementById('invitationImage'),loading=document.getElementById('loading');
    let opened=false;
    function loadInvitation(){
      return new Promise(resolve=>{
        if(invitationImage.complete&&invitationImage.naturalWidth){resolve();return}
        invitationImage.onload=()=>resolve();invitationImage.onerror=()=>resolve();
        invitationImage.src=invitationImage.dataset.src;
      });
    }
    async function openInvitation(){
      if(opened)return;opened=true;cover.classList.add('opening');loading.classList.add('show');
      if(!music.src)music.src=music.dataset.src;
      try{music.volume=.72;await music.play();musicToggle.textContent='❚❚';}catch(e){musicToggle.textContent='♪'}
      musicToggle.classList.add('show');
      const imagePromise=loadInvitation();
      await Promise.all([imagePromise,new Promise(r=>setTimeout(r,650))]);
      invite.style.setProperty('--invitation-bg',`url("${invitationImage.src}")`);invite.classList.add('bg-ready');loading.classList.remove('show');
      cover.style.display='none';invite.classList.add('show');window.scrollTo(0,0);
    }
    openBtn.addEventListener('click',openInvitation);openLabel.addEventListener('click',openInvitation);
    musicToggle.addEventListener('click',async()=>{if(music.paused){try{await music.play();musicToggle.textContent='❚❚'}catch(e){}}else{music.pause();musicToggle.textContent='♪'}});
    const target=new Date('2026-08-11T00:00:00+03:00').getTime();
    const el={days:document.getElementById('days'),hours:document.getElementById('hours'),minutes:document.getElementById('minutes'),seconds:document.getElementById('seconds')};
    function tick(){let d=Math.max(0,target-Date.now());const days=Math.floor(d/86400000);d%=86400000;const hours=Math.floor(d/3600000);d%=3600000;const minutes=Math.floor(d/60000);d%=60000;const seconds=Math.floor(d/1000);el.days.textContent=String(days).padStart(2,'0');el.hours.textContent=String(hours).padStart(2,'0');el.minutes.textContent=String(minutes).padStart(2,'0');el.seconds.textContent=String(seconds).padStart(2,'0')}
    tick();setInterval(tick,1000);
  </script>
</body>
</html>
